<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>گروه پزشکی پیام نور البرز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<link rel="preload" as="image" href="university.jpg" fetchpriority="high">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/nav.css">
</head>
<body data-page="index">

<div id="site-header-root"></div>

<div id="mainPage">
    <div class="hero">
        <img src="university.jpg" alt="دانشگاه" class="hero-image" width="384" height="512">
        <div class="hero-overlay">
            <span class="kicker">دانشگاه پیام نور · استان البرز</span>
            <h1>گروه پزشکی واحد کرج</h1>
            <div class="hero-line"></div>
        </div>
    </div>

    <div class="container">
        <div id="newsList"></div>
        <footer>ویژه دانشجویان پزشکی</footer>
    </div>
</div>

<div id="fullNewsPage" class="full-news-page">
    <button class="back-btn" onclick="closeFullNews()">← بازگشت</button>
    <div class="full-news-card">
        <h1 class="full-news-title" id="fullTitle"></h1>
        <span class="full-news-date" id="fullDate"></span>
        <div class="full-news-image" id="fullImage" style="display:none;"></div>
        <div class="full-news-text" id="fullText"></div>
    </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/nav.js"></script>
<script>
    const newsDatabase = [
        {
            id: 4,
            urgent: true,
            urgentLabel: "ثبت‌نام آزمون ارشد پزشکی",
            title: "ثبت‌نام دوره ترکیبی دانشگاه و بیمارستان ویژه آمادگی آزمون کارشناسی ارشد",
            summary: "ثبت‌نام دوره ترکیبی دانشگاه و بیمارستان، ویژه آماده‌سازی دانشجویان پزشکی برای آزمون کارشناسی ارشد، آغاز شد. این دوره برای ورودی‌های ۱۴۰۲ الزامی است و مهلت ثبت‌نام شنبه ۱۷ مرداد ۱۴۰۵ می‌باشد.",
            fullText: "به اطلاع کلیه دانشجویان پزشکی گروه پزشکی دانشگاه پیام نور استان البرز می‌رساند، ثبت‌نام «دوره ترکیبی دانشگاه و بیمارستان» ویژه آماده‌سازی آزمون کارشناسی ارشد آغاز شده است.\n\nاین دوره با هدف تقویت بنیه علمی و بالینی دانشجویان و افزایش آمادگی ایشان برای آزمون کارشناسی ارشد طراحی شده و ترکیبی از آموزش‌های دانشگاهی و تجربه‌های عملی در بستر بیمارستان‌های آموزشی را در اختیار دانشجویان قرار می‌دهد. برگزاری این دوره زیر نظر مستقیم دانشگاه علوم پزشکی و وزارت علوم، تحقیقات و فناوری انجام می‌شود.\n\nمدت دوره یک سال تحصیلی است و کلاس‌ها هفته‌ای دو جلسه سه‌ساعته برگزار می‌شود. با توجه به هماهنگی‌های بیمارستانی، ساعت شروع جلسات متغیر بوده و از طریق پیامک به اطلاع دانشجویان خواهد رسید؛ بنابراین دانشجویان محترم لازم است تلفن همراه خود را در دسترس داشته باشند.\n\nشرکت در این دوره برای کلیه دانشجویان ورودی ۱۴۰۲ الزامی است.\n\nهزینه ثبت‌نام دوره مبلغ ۵٬۷۰۰٬۰۰۰ تومان (پنج میلیون و هفتصد هزار تومان) تعیین شده است.\n\nدانشجویان ورودی ۱۴۰۲ موظف‌اند روز شنبه مورخ ۱۷ مرداد ۱۴۰۵ به واحد آموزش دانشگاه پیام نور استان البرز مراجعه و مبلغ ثبت‌نام را پرداخت نمایند. پس از تکمیل ثبت‌نام، زمان دقیق شروع جلسات از طریق پیامک به دانشجویان اطلاع‌رسانی خواهد شد.\n\nخواهشمند است این اطلاعیه را جدی گرفته و از مراجعه در روز و ساعت مقرر اطمینان حاصل فرمایید. در صورت وجود هرگونه سوال، با آموزش گروه پزشکی در تماس باشید.",
            date: "۱۵ مرداد ۱۴۰۵"
        },
        {
            id: 0,
            urgent: true,
            title: "از این پس اخبار گروه پزشکی از همین سایت منتشر می‌شود",
            summary: "این سایت به‌عنوان مرجع رسمی اطلاع‌رسانی گروه پزشکی دانشگاه پیام نور استان البرز فعال شد؛ اخبار، اطلاعیه‌ها و پروفایل دانشجویی از این پس فقط از همین‌جا منتشر و قابل مشاهده خواهد بود.",
            fullText: "به اطلاع کلیه دانشجویان گروه پزشکی دانشگاه پیام نور استان البرز می‌رساند، از این تاریخ به بعد، کلیه اخبار، اطلاعیه‌ها، برنامه‌های آموزشی و اطلاع‌رسانی‌های رسمی گروه پزشکی صرفاً از طریق همین سایت منتشر خواهد شد. لطفاً به‌طور مرتب به این سایت مراجعه کنید تا از آخرین اخبار و اطلاعیه‌ها بی‌اطلاع نمانید.\n\nهمچنین دانشجویان پزشکی از این پس می‌توانند پروفایل دانشجویی خود شامل مشخصات، وضعیت نمرات و سوابق تحصیلی را از بخش «پروفایل» همین سایت مشاهده کنند و دیگر نیازی به مراجعه به سامانه‌های قبلی نیست.\n\nخواهشمند است این اطلاعیه را جدی گرفته و در صورت وجود هرگونه ابهام، با آموزش گروه پزشکی در تماس باشید.",
            date: "۱۴ مرداد ۱۴۰۵"
        },
        {
            id: 1,
            urgent: true,
            title: "نتایج نمرات ترم ۴۰۴۲ اعلام شد",
            summary: "نمرات ترم ۴۰۴۲ دانشجویان پزشکی ثبت و اعلام شد. دانشجویان می‌توانند با ورود به سامانه دانشجویی همین سایت، نتایج نمرات ترم ۴۰۴۲ خود را مشاهده کنند.",
            fullText: "نتایج نمرات ترم ۴۰۴۲ اعلام شد.\n\nبه اطلاع کلیه دانشجویان گروه پزشکی دانشگاه پیام نور استان البرز می‌رساند، نمرات ترم ۴۰۴۲ در سامانه ثبت و نهایی شد.\n\nدانشجویان عزیز می‌توانند با ورود به «سامانه دانشجویی» در همین سایت، نتایج نمرات ترم ۴۰۴۲ خود را مشاهده نمایند. در صورت وجود هرگونه سوال یا اعتراض به نمره، لازم است ظرف مهلت مقرر با آموزش گروه پزشکی هماهنگ شود.",
            date: "۱۴ مرداد ۱۴۰۵"
        },
        {
            id: 2,
            title: "نفرات برتر ترم ۴۰۴۲ اعلام شد",
            summary: "اسامی دانشجویان برتر ترم ۴۰۴۲ مشخص شد. برای مشاهده اسامی به بخش «برترین دانشجویان ترم» مراجعه کنید.",
            fullText: "ضمن تبریک به دانشجویان ممتاز، اسامی نفرات برتر ترم ۴۰۴۲ گروه پزشکی دانشگاه پیام نور استان البرز اعلام شد.\n\nبرای مشاهده اسامی و رتبه‌بندی دانشجویان برتر، از منوی سایت وارد بخش «برترین دانشجویان ترم» شوید.\n\nضمن تبریک مجدد به دانشجویان برگزیده، برای سایر دانشجویان نیز آرزوی موفقیت روزافزون داریم.",
            date: "۱۴ مرداد ۱۴۰۵"
        },
        {
            id: 3,
            image: "assets/payam-books.jpg",
            title: "راهنمای تهیه کتاب‌های چاپی دانشگاه پیام نور",
            summary: "دانشجویان می‌توانند کتاب‌های درسی چاپ دانشگاه پیام نور را از سامانه فروش آنلاین یا نمایندگی‌های مجاز در سراسر کشور تهیه کنند؛ امکان ارسال پستی و تخفیف با کد اساتید نیز فراهم است.",
            fullText: "به اطلاع دانشجویان گروه پزشکی می‌رساند، کتاب‌های درسی چاپ دانشگاه پیام نور از طریق نمایندگی‌های فروش مجاز دانشگاه در سراسر کشور قابل تهیه است.\n\nبرای سهولت دسترسی، سامانه فروش آنلاین کتاب‌های درسی به آدرس digibook.pnu.ac.ir راه‌اندازی شده و دانشجویان می‌توانند از این سامانه به‌صورت غیرحضوری خرید کنند.\n\nپس از ثبت سفارش، امکان دریافت کتاب‌ها با ارسال پستی درب منزل نیز وجود دارد.\n\nهمچنین در این سامانه تخفیفاتی نیز در نظر گرفته شده است؛ دانشجویان می‌توانند با دریافت کد تخفیف از اساتید خود، خرید خود را با تخفیف انجام دهند.",
            date: "۱۴ مرداد ۱۴۰۵"
        }
    ];

    function showNewsList() {
        const container = document.getElementById('newsList');
        container.innerHTML = newsDatabase.map(item => `
            <div class="news-card${item.urgent ? ' urgent' : ''}" onclick="showFullNews(${item.id})">
                ${item.urgent ? `<span class="urgent-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.5 17a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg> ${item.urgentLabel || 'فوری'}</span>` : ''}
                ${item.image ? `<img src="${item.image}" alt="${item.title}" class="news-card-image">` : ''}
                <div class="news-title">${item.title}</div>
                <div class="news-summary">${item.summary}</div>
                <div class="news-meta">
                    <span class="news-date">${item.date}</span>
                    <button class="read-more" onclick="event.stopPropagation(); showFullNews(${item.id})">مطالعه</button>
                </div>
            </div>
        `).join('');
    }

    function showFullNews(id) {
        const news = newsDatabase.find(n => n.id === id);
        if (!news) return;
        document.getElementById('fullTitle').innerText = news.title;
        document.getElementById('fullDate').innerText = news.date;
        document.getElementById('fullText').innerText = news.fullText;

        const imgHolder = document.getElementById('fullImage');
        if (news.image) {
            imgHolder.innerHTML = `<img src="${news.image}" alt="${news.title}">`;
            imgHolder.style.display = 'block';
        } else {
            imgHolder.innerHTML = '';
            imgHolder.style.display = 'none';
        }

        const fullPage = document.getElementById('fullNewsPage');
        document.getElementById('mainPage').style.display = 'none';
        fullPage.classList.add('show');
        window.scrollTo(0, 0);
        try { history.pushState({ page: 'fullNews' }, '', '#news'); } catch (err) { /* روی برخی وب‌ویوها (مثل file://) مجاز نیست؛ نمایش کامل خبر بدون آن هم درست کار می‌کند */ }
    }

    function closeFullNews() {
        document.getElementById('fullNewsPage').classList.remove('show');
        document.getElementById('mainPage').style.display = 'block';
        try { history.replaceState({ page: 'main' }, '', window.location.pathname); } catch (err) { /* بی‌خطر نادیده گرفته می‌شود */ }
    }

    window.addEventListener('popstate', () => {
        if (document.getElementById('fullNewsPage').classList.contains('show')) {
            closeFullNews();
        }
    });

    showNewsList();
</script>
</body>
</html>
